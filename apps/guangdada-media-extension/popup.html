<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>广大大媒体下载</title></head>
<body>
  <header><span>GDD / MEDIA</span><h1>把灵感带走。</h1><p>图片、视频与 Playable，汇总成一个 ZIP</p></header>
  <main>
    <div class="types"><label><input id="image" type="checkbox" checked> 图片</label><label><input id="video" type="checkbox" checked> 视频</label><label><input id="playable" type="checkbox" checked> Playable</label></div>
    <p style="color:#526681;font-size:12px">Playable 获取原 HTML；外部依赖未打包，打开可能需要联网。</p>
    <div class="range"><label for="mode">采集范围</label><select id="mode"><option value="current">仅当前页全部</option><option value="basket">跨页已选清单</option><option value="pages">自动翻页（每页全部）</option></select></div>
    <div id="page-options" hidden><div class="range"><label for="end">采集终点</label><select id="end"><option value="count">输入采集页数</option><option value="last">一直采到末页</option></select></div><div id="count-row" class="range"><label for="pages">最多采集页数</label><input id="pages" type="number" value="3" min="1" max="1000" step="1" aria-label="最多采集页数"></div></div>
    <button id="select" style="width:100%;margin:12px 0 6px">跨页点选素材</button>
    <section id="cart" hidden><strong id="cart-count"></strong><ul id="cart-pages"></ul><button id="clear-cart">清空跨页清单</button></section>
    <p id="scope" style="color:#526681">从左到右、从上到下编号；点击卡片左上角勾选。</p>
    <button id="start" class="primary">一键打包 ZIP</button>
    <p id="message" role="status">请先登录广大大并打开素材页面。</p>
    <section id="progress" hidden>
      <progress id="bar" max="1" value="0"></progress>
      <p id="counts"></p><p id="folder"></p>
      <button id="authorize" class="primary" hidden>授权并继续打包 ZIP</button>
      <div class="actions"><button id="retry">重新打包</button><button id="stop">停止打包</button><button id="downloads">查看下载</button></div>
      <button id="report" style="width:100%;margin:8px 0">查看下载报告.md</button>
      <details><summary>失败详情</summary><ul id="errors"></ul></details>
    </section>
<footer>v1.8.0 · 一个 ZIP，内含下载报告.md。<br>图片、视频、Playable 均可跨页选择。<br>可输入采集页数或采到末页。<br>关闭弹窗后继续打包；单批媒体上限 512MB。</footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
