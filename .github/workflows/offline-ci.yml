name: Offline CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: offline-contracts-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run fixed gate in isolated network namespace
        # Hosted runner only. PRs never execute on the production Mac mini.
        # Namespace also blocks egress from native subprocesses such as ffmpeg/git.
        run: sudo unshare --net -- env PATH="$PATH" CI=true "$(command -v python)" scripts/ci_offline.py
